name: Generate Contribution Snake

on:
  schedule:
    # हर 12 घंटे में snake दोबारा generate होगा
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF9933&color_dots=#161b22,#663300,#994c00,#cc6600,#FF9933
            dist/github-snake-dark.svg?color_snake=#FF6600&color_dots=#161b22,#663300,#994c00,#cc6600,#FFB366

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
