name: Generate Metrics

on:
  schedule:
    # रोज़ सुबह 6 बजे IST (00:30 UTC) stats refresh
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # सारे cards के लिए एक जैसा dark theme (GitHub dark mode से match करता है)
  DARK_CSS: |
    svg { background: #0d1117; color: #c9d1d9; }
    h1, h2 { color: #58a6ff !important; }
    .field svg, .row svg { fill: #8b949e; }
    .field, .row, section { color: #c9d1d9; }
    :root {
      --color-calendar-graph-day-bg: #161b22;
      --color-calendar-graph-day-border: rgba(255,255,255,0.05);
    }

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1) Overall stats — commits, repos, stars, followers
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CodeBhaukaal
          filename: assets/metrics-overview.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          extras_css: ${{ env.DARK_CSS }}

      # 2) 3D contribution calendar (isometric graph)
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CodeBhaukaal
          filename: assets/metrics-isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: ${{ env.DARK_CSS }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3) Language breakdown
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CodeBhaukaal
          filename: assets/metrics-languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: ${{ env.DARK_CSS }}
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # 4) Coding habits — कब और कैसे code होता है
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CodeBhaukaal
          filename: assets/metrics-habits.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: ${{ env.DARK_CSS }}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
